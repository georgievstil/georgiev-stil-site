# =====================================================================
# Конфигурация за Pages CMS (pagescms.org) — браузър панел за Гери
# ---------------------------------------------------------------------
# Гери влиза в app.pagescms.org с GitHub (на нейния компютър),
# отваря този проект и редактира продуктите чрез форми.
# Промените се записват в data/products.json и снимките в assets/uploads/,
# а Cloudflare Pages автоматично публикува сайта за ~1 минута.
# =====================================================================

media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: catalog
    label: Каталог (продукти)
    type: file
    path: data/products.json
    fields:
      - name: categories
        label: Направления
        type: object
        list: true
        fields:
          - { name: id, label: "ID (латиница)", type: string }
          - { name: name, label: Име, type: string }
          - { name: subcategories, label: Подкатегории, type: string, list: true }

      - name: products
        label: Продукти
        type: object
        list: true
        fields:
          - { name: title, label: Заглавие, type: string }
          - name: category
            label: Направление
            type: select
            options:
              values:
                - { value: mebeli, label: Мебели }
                - { value: dograma, label: Дограма }
                - { value: shtori, label: Щори }
                - { value: vrati, label: Врати }
          - name: subcategory
            label: Подкатегория
            type: select
            options:
              values:
                - Дивани
                - Легла
                - Спални комплекти
                - Гардероби
                - Секции и шкафове
                - Трапезни маси
                - Столове
                - Матраци
                - Детско обзавеждане
                - PVC дограма
                - Алуминиева дограма
                - Плъзгащи системи
                - Комарници
                - Остъкляване на тераси
                - Вътрешни щори
                - Вертикални щори
                - Хоризонтални щори
                - Руло щори
                - Ден и нощ
                - Външни щори
                - Входни врати
                - Интериорни врати
          - name: image
            label: Основна снимка
            type: image
            description: Тази се вижда в категорията и е първа на страницата на продукта.
          - name: gallery
            label: Още снимки
            type: image
            description: Може да качиш много наведнъж. Подреждат се с влачене. Показват се на страницата на продукта.
            options:
              multiple: true
          - name: desc
            label: Описание
            type: text
            description: Показва се на страницата на продукта. Ред, завършващ на двоеточие (напр. „Размери:“), става подзаглавие.
          - { name: price, label: "Цена / надпис", type: string, default: "по запитване" }
          - { name: featured, label: "Акцент (напред)", type: boolean, default: false }
